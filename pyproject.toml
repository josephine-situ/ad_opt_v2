[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ad-opt-v2"
version = "0.2.0"
description = "Campaign-level Google Ads budget and keyword-set optimization"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-ads>=29.1.0",
    "numpy>=2.4.5",
    "pandas>=3.0.3",
    "python-dateutil>=2.9.0",
    "requests>=2.32.0",
    "sentence-transformers>=3.4.0",
    "pyarrow>=19.0.0",
    "holidays>=0.97",
    "scikit-learn>=1.6.0",
    "joblib>=1.4.0",
]

[project.optional-dependencies]
ml = ["xgboost>=2.1.0", "shap>=0.46.0"]
optimization = ["gurobipy>=10.0.1"]
notebook = [
    "ipykernel>=7.2.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.10.9",
    "seaborn>=0.13.2",
    "statsmodels>=0.14.6",
]
dev = ["pytest>=8.0.0", "black>=24.0.0"]

[project.scripts]
prepare-data = "campaign_opt.cli.prepare_data:main"
backtest = "campaign_opt.cli.backtest:main"
run-pipeline = "campaign_opt.cli.run_pipeline:main"
fit-models = "campaign_opt.cli.fit_models:main"
analyze-backtest = "campaign_opt.cli.analyze_backtest:main"

[tool.setuptools]
py-modules = ["config"]

[tool.setuptools.packages.find]
where = ["."]
include = ["utils*", "campaign_opt*"]

[tool.black]
line-length = 100
