[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ad-opt-v2"
version = "0.1.0"
description = "Google Ads API data pull scripts for ad optimization workflows"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-ads>=29.1.0",
    "ipykernel>=7.2.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.10.9",
    "numpy>=2.4.5",
    "pandas>=3.0.3",
    "python-dateutil>=2.9.0",
    "requests>=2.32.0",
    "seaborn>=0.13.2",
    "sentence-transformers>=3.4.0",
    "pyarrow>=19.0.0",
    "statsmodels>=0.14.6",
    "holidays>=0.97",
]

[tool.setuptools]
packages = ["utils", "scripts"]

[tool.black]
line-length = 100
